# 3 GB, nao 8 GB. A maquina tem 15,7 GB no total e tipicamente ~4 GB
# livres depois de um build web; pedir 8 GB fazia o daemon nem chegar a
# arrancar e o build morria com "Gradle build daemon disappeared".
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Evita falhas/travamentos de cache incremental Kotlin em Windows com plugins pub em roots diferentes.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# 16K page size (alvo API 35+ / Play 2025): NDK r28+ e AGP 8.5.1+ em android/app e settings;
# se a Play apontar uma .so ainda 4K, actualize o plugin a que pertence. developer.android.com/guide/practices/page-sizes
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 8.12/8.13: integra a remoção de recursos ao passe de otimização do R8.
# No AGP 9+ esta opção passa a ser automática.
android.r8.optimizedResourceShrinking=true
