# iOS — build IPA assinado + TestFlight (Gestao YAHWEH)
# GERADO a partir do workflow "ios-release" do codemagic.yaml: cada passo abaixo roda
# exatamente o mesmo script que rodava no Codemagic. O motor tambem e o mesmo
# (codemagic-cli-tools, open source), e os scripts em scripts/codemagic_ios_* leem
# tudo por variavel de ambiente.
#
# Para regerar depois de mexer no codemagic.yaml:
#   python scripts/gerar_workflow_ios_do_codemagic.py
#
# ---------------------------------------------------------------------------
# Configuracao UNICA (rode: .\scripts\configurar_github_ios.ps1)
# Secrets em: Settings > Secrets and variables > Actions
#   APP_STORE_CONNECT_PRIVATE_KEY     conteudo do .p8 da chave App Store Connect API
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID (ex.: 85X9UNAT43)
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID (UUID)
#   CERTIFICATE_PRIVATE_KEY           Base64 do .p12 Apple Distribution (modo manual)
#   CM_PROVISIONING_PROFILE           Base64 do .mobileprovision App Store (modo manual)
#   CM_CERTIFICATE_PASSWORD           senha do .p12, se tiver
#   FIREBASE_SERVICE_ACCOUNT_JSON     (opcional) service account p/ subir o IPA ao site
# ---------------------------------------------------------------------------
# Disparo: manual (Actions > iOS TestFlight > Run workflow) ou push nas branches
# codemagic-*-ready / ios-release-*.
# Repo privado: runner macOS consome 10x os minutos gratuitos — por isso NAO dispara na main.

name: iOS TestFlight (Gestao YAHWEH)

on:
  workflow_dispatch:
    inputs:
      setup_capabilities:
        description: 'Ativar capabilities no App ID (Sign in with Apple, Push, App Groups, Associated Domains). Desmarque nos builds seguintes: economiza minutos de espera.'
        type: boolean
        default: true
      enviar_testflight:
        description: 'Enviar o IPA para o TestFlight'
        type: boolean
        default: true
      subir_site:
        description: 'Subir o IPA para o site (Firebase Storage)'
        type: boolean
        default: true
  push:
    branches:
      - 'codemagic-*-ready'
      - 'ios-release-*'

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    env:
      # CM_BUILD_DIR: os scripts usam ${CM_BUILD_DIR:-...} para achar a raiz do repo.
      CM_BUILD_DIR: ${{ github.workspace }}
      # CM_ENV: arquivo por onde o Codemagic propaga variaveis entre passos.
      # github.env e o equivalente do GitHub Actions (mesmo formato NOME=valor).
      CM_ENV: ${{ github.env }}
      CM_USE_CODEMAGIC_TEAM_SIGNING: 0
      CM_FORCE_API_ONLY_SIGNING: 0
      CM_CI_BOOTSTRAP_DISTRIBUTION_IF_NO_PEM: 0
      CM_AUTO_BOOTSTRAP_PEM_MISMATCH: 1
      CM_DISALLOW_API_ONLY_SIGNING: 0
      CM_AUTO_REVOKE_STALE_DISTRIBUTION_CERTS: 1
      APP_STORE_APPLE_ID: 6761656626
      BUNDLE_ID: com.gestaoyahwehios.app
      WIDGET_BUNDLE_ID: com.gestaoyahwehios.app.GestaoYahwehWidget
      APP_GROUP_ID: group.com.gestaoyahwehios.app.widget
      APP_GROUP_NAME: Gestao Yahweh Widget
      IOS_BUNDLE_ID: com.gestaoyahwehios.app
      FIREBASE_IOS_APP_ID: '1:157235497908:ios:81977b3cd1ba58614ac0e1'
      FIREBASE_APP_DISTRIBUTION_GROUPS: testers
      YAHWEH_TDLIB_IOS_ENABLED: 0
      YAHWEH_TDLIB_IOS_TRY_NATIVE: 0
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      CM_CERTIFICATE: ${{ secrets.CM_CERTIFICATE }}
      CM_CERTIFICATE_PASSWORD: ${{ secrets.CM_CERTIFICATE_PASSWORD }}
      CM_PROVISIONING_PROFILE: ${{ secrets.CM_PROVISIONING_PROFILE }}
      CM_DISTRIBUTION_CERT_PRIVATE_KEY_PEM: ${{ secrets.CM_DISTRIBUTION_CERT_PRIVATE_KEY_PEM }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets obrigatorios
        run: |
          faltou=0
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret ausente: $v"; faltou=1; fi
          done
          if [ "$faltou" != "0" ]; then
            echo "Rode scripts/configurar_github_ios.ps1 para preencher os secrets."
            exit 1
          fi
          echo "Secrets OK."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar codemagic-cli-tools
        run: pip install --upgrade codemagic-cli-tools PyJWT cryptography

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # A Apple so aceita upload de app construido com o SDK do iOS 26 (Xcode 26+).
      # A imagem traz varios Xcode 26.x, mas nem todos tem a plataforma iOS instalada
      # (o build morre em "iOS 26.0 is not installed"). Pega o mais novo que TENHA o SDK.
      - name: Selecionar Xcode 26+ com SDK iOS instalado
        run: |
          set -e
          LISTA=$(for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "")
            [ -n "$v" ] && echo "$v|$app"
          done | sort -t'|' -k1,1 -Vr)
          if [ -z "$LISTA" ]; then echo "::error::nenhum Xcode encontrado no runner"; exit 1; fi
          ESCOLHIDO=""
          SDK_VER=""
          while IFS='|' read -r v app; do
            [ -n "$app" ] || continue
            case "${v%%.*}" in ''|*[!0-9]*) continue ;; esac
            [ "${v%%.*}" -ge 26 ] || continue
            sdk=$(DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "")
            echo "Xcode $v -> SDK iphoneos: ${sdk:-<plataforma iOS nao instalada>}"
            if [ -n "$sdk" ] && [ "${sdk%%.*}" -ge 26 ]; then ESCOLHIDO="$app"; SDK_VER="$sdk"; break; fi
          done <<< "$LISTA"
          if [ -z "$ESCOLHIDO" ]; then
            echo "::error::nenhum Xcode 26+ com SDK iOS 26 instalado neste runner."
            exit 1
          fi
          sudo xcode-select -s "$ESCOLHIDO/Contents/Developer"
          echo "DEVELOPER_DIR=$ESCOLHIDO/Contents/Developer" >> "$GITHUB_ENV"
          echo "Usando: $ESCOLHIDO (SDK iOS $SDK_VER)"

      - name: Ambiente
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          flutter --version
          app-store-connect --version || true

      - name: Detectar layout (monorepo flutter_app/ vs Flutter na raiz)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          cd "$ROOT"
          if [ -f flutter_app/pubspec.yaml ]; then
            echo mono > /tmp/cm_yw_layout
            echo "CM_YW_LAYOUT=mono → Flutter em $ROOT/flutter_app"
          elif [ -f pubspec.yaml ]; then
            echo root > /tmp/cm_yw_layout
            echo "CM_YW_LAYOUT=root → Flutter na raiz $ROOT"
          else
            echo "ERRO: pubspec.yaml nao encontrado em $ROOT nem $ROOT/flutter_app/"
            ls -la
            exit 1
          fi

      - name: Flutter pub get
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          flutter config --no-enable-swift-package-manager
          cd "$ROOT"
          case "$(cat /tmp/cm_yw_layout)" in mono) cd flutter_app ;; root) ;; *) echo "ERRO: /tmp/cm_yw_layout ausente"; exit 1 ;; esac
          flutter pub get

      - name: TDLib iOS automático (setup ou fallback)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          case "$(cat /tmp/cm_yw_layout)" in
            mono) FLUTTER_DIR="$ROOT/flutter_app" ;;
            root) FLUTTER_DIR="$ROOT" ;;
            *) echo "ERRO: layout"; exit 1 ;;
          esac
          chmod +x "$ROOT/scripts/codemagic_ios_tdlib_auto.sh" || true
          bash "$ROOT/scripts/codemagic_ios_tdlib_auto.sh" "$ROOT" "$FLUTTER_DIR"
          if [ -f /tmp/cm_yw_tdlib_ios_enabled ]; then
            export YAHWEH_TDLIB_IOS_ENABLED="$(cat /tmp/cm_yw_tdlib_ios_enabled)"
            echo "YAHWEH_TDLIB_IOS_ENABLED=$YAHWEH_TDLIB_IOS_ENABLED"
          fi

      - name: Verificar variaveis Apple (API + assinatura)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_verify_env_apple_and_signing.sh"

      - name: Keychain para code signing
        run: |
          set -e
          keychain initialize

      - name: Preparar PEM App Store Connect (/tmp/_asc_ok.pem)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_prepare_api_pem.sh"

      - name: Ativar Sign In with Apple no App ID (API Apple)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.setup_capabilities }}
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          python3 "$ROOT/scripts/codemagic_ios_enable_sign_in_with_apple.py"

      - name: Ativar Push Notifications no App ID (API Apple)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.setup_capabilities }}
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          export IOS_BUNDLE_ID="${IOS_BUNDLE_ID:-$BUNDLE_ID}"
          python3 "$ROOT/scripts/codemagic_ios_enable_push_notifications.py"

      - name: Ativar App Groups no App e Widget (API Apple)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.setup_capabilities }}
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          export BUNDLE_ID WIDGET_BUNDLE_ID APP_GROUP_ID APP_GROUP_NAME
          python3 "$ROOT/scripts/codemagic_ios_enable_app_groups.py"

      - name: Registar App Groups no portal (Xcode + ASC key)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.setup_capabilities }}
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          export APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID APP_GROUP_ID
          bash "$ROOT/scripts/codemagic_ios_register_app_groups_via_xcode.sh"

      - name: Ativar Associated Domains no App ID (API Apple)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.setup_capabilities }}
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          export IOS_BUNDLE_ID="${IOS_BUNDLE_ID:-$BUNDLE_ID}"
          python3 "$ROOT/scripts/codemagic_ios_enable_associated_domains.py"

      - name: Remover perfis App Store antigos (força perfil com capabilities atuais)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          export BUNDLE_ID WIDGET_BUNDLE_ID
          # Remove na Apple (API) + limpeza local — perfil Bootstrap antigo sem App Groups.
          python3 "$ROOT/scripts/codemagic_ios_delete_appstore_profiles.py" || true
          bash "$ROOT/scripts/codemagic_ios_remove_old_appstore_profiles.sh"
          # Também limpa profiles locais da extensão Widget
          PROFILES_HOME="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          shopt -s nullglob
          for f in "$PROFILES_HOME"/*.mobileprovision; do
            if security cms -D -i "$f" 2>/dev/null | grep -qF "${WIDGET_BUNDLE_ID}"; then
              echo "Removendo perfil Widget antigo: $(basename "$f")"
              rm -f "$f"
            fi
          done

      - name: Buscar ou criar certificado e perfil (Apple) — instalar P12 + mobileprovision + ExportOptions
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_install_signing.sh"

      - name: Buscar ou criar perfil da extensão Widget iOS (Apple)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          export WIDGET_BUNDLE_ID APP_GROUP_ID BUNDLE_ID IOS_BUNDLE_ID
          if [ ! -s /tmp/cm_distribution.p12 ]; then
            for cand in /tmp/cm_api_only_identity.p12 /tmp/cm_api_only_from_secret.p12 /tmp/_cm_verify_p12.bin; do
              if [ -s "$cand" ]; then
                cp -f "$cand" /tmp/cm_distribution.p12
                chmod 600 /tmp/cm_distribution.p12
                echo "OK: P12 copiado de $cand → /tmp/cm_distribution.p12"
                break
              fi
            done
          fi
          python3 "$ROOT/scripts/codemagic_ios_ensure_widget_appstore_profile.py"
          # Critico: se o perfil nao tem group.com, remove a entitlement (codesign passa).
          python3 "$ROOT/scripts/codemagic_ios_align_app_group_entitlements.py"
          # Push: perfil sem aps → remove entitlement + remote-notification (anti Binário inválido).
          python3 "$ROOT/scripts/codemagic_ios_align_push_entitlements.py"

      - name: Verificar perfil vs P12 Distribution (fail-fast, antes do pod)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          if [ ! -f "$ROOT/scripts/codemagic_ios_verify_profile_matches_p12.sh" ]; then
            echo "ERRO: falta $ROOT/scripts/codemagic_ios_verify_profile_matches_p12.sh (obrigatorio no CI)."
            exit 1
          fi
          # Garante align mesmo se o passo Widget falhou a meio (re-run parcial).
          python3 "$ROOT/scripts/codemagic_ios_align_app_group_entitlements.py" || true
          python3 "$ROOT/scripts/codemagic_ios_align_push_entitlements.py" || true
          bash "$ROOT/scripts/codemagic_ios_verify_profile_matches_p12.sh"

      - name: Validar perfil Widget + ExportOptions (App Groups)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          cd "$ROOT"
          case "$(cat /tmp/cm_yw_layout)" in mono) cd flutter_app ;; root) ;; *) echo "ERRO: layout"; exit 1 ;; esac
          export BUNDLE_ID WIDGET_BUNDLE_ID APP_GROUP_ID
          export EXPORT_OPTIONS_PATH="/tmp/ExportOptions.plist"
          python3 "$ROOT/scripts/codemagic_ios_verify_widget_profile.py"
          python3 "$ROOT/scripts/codemagic_ios_write_export_options.py" -o /tmp/ExportOptions.plist
          python3 "$ROOT/scripts/codemagic_ios_write_export_options.py" -o ios/ExportOptions.plist
          python3 "$ROOT/scripts/codemagic_ios_validate_export_options.py"
          echo "--- ExportOptions ---"
          plutil -p /tmp/ExportOptions.plist || true

      - name: Garantir iOS deployment target 15.5 (ML Kit / Firebase)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_ensure_deployment_target_15.sh"

      - name: Limpar cache Pods (invalidar flutter_libtdjson removido)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          echo "Removendo Pods/ e Podfile.lock antigos para rebuild limpo..."
          rm -rf "$ROOT/flutter_app/ios/Pods" || true
          rm -f "$ROOT/flutter_app/ios/Podfile.lock" || true
          pod cache clean --all || true
          echo "OK: cache limpo"

      - name: CocoaPods
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_pod_install.sh"

      - name: Reforçar iOS deployment target 15.5 nos Pods (pós-install)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_bump_pods_deployment_to_15.sh"

      - name: Aplicar perfis ao projeto Xcode
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          cd "$ROOT"
          case "$(cat /tmp/cm_yw_layout)" in mono) cd flutter_app/ios ;; root) cd ios ;; *) echo "ERRO: layout"; exit 1 ;; esac
          export BUNDLE_ID WIDGET_BUNDLE_ID APP_GROUP_ID
          # Runner + GestaoYahwehWidgetExtension — perfis App Store com App Groups.
          xcode-project use-profiles \
            --project Runner.xcodeproj \
            --archive-method app-store \
            --code-signing-setup-verbose-logging
          echo "--- Identidades de assinatura (esperado: Apple Distribution + perfil App Store) ---"
          security find-identity -v -p codesigning | head -40 || true
          # Regrava ExportOptions com app + Widget (use-profiles / install pode ter sobrescrito só o Runner).
          export EXPORT_OPTIONS_PATH="/tmp/ExportOptions.plist"
          python3 "$ROOT/scripts/codemagic_ios_write_export_options.py" -o /tmp/ExportOptions.plist
          python3 "$ROOT/scripts/codemagic_ios_write_export_options.py" -o ExportOptions.plist
          python3 "$ROOT/scripts/codemagic_ios_validate_export_options.py"
          test -f /tmp/ExportOptions.plist
          test -f ExportOptions.plist
          echo "OK: ExportOptions em /tmp e $(pwd)/ExportOptions.plist"

      - name: Versão iOS = mesma base do iPhone/Web (app_version.dart) + build único
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_sync_version_from_app_version_dart.sh"

      - name: Build iOS IPA (instalável)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-$(pwd)}"
          cd "$ROOT"
          case "$(cat /tmp/cm_yw_layout)" in mono) cd flutter_app ;; root) ;; *) echo "ERRO: layout"; exit 1 ;; esac
          FLUTTER_PWD="$(pwd)"

          echo "--- Re-validar perfil .mobileprovision vs P12 (fail-fast antes do archive) ---"
          bash "$ROOT/scripts/codemagic_ios_verify_profile_matches_p12.sh"

          if [ ! -f /tmp/cm_ios_build_name ] || [ ! -f /tmp/cm_ios_build_number ]; then
            echo "::error::execute o passo 'Versao iOS' antes do build (faltam /tmp/cm_ios_build_*)."
            exit 1
          fi
          export GHA_IOS_BUILD_NAME="$(tr -d '[:space:]' < /tmp/cm_ios_build_name)"
          export GHA_IOS_BUILD_NUMBER="$(tr -d '[:space:]' < /tmp/cm_ios_build_number)"
          if [ -z "$GHA_IOS_BUILD_NAME" ] || [ -z "$GHA_IOS_BUILD_NUMBER" ]; then
            echo "::error::build-name ou build-number vazio apos o sync iOS."
            exit 1
          fi

          # Asset dotenv: o pubspec lista .env.example (commitado). Nunca exigir .env (gitignore).
          if [ ! -f .env.example ]; then
            echo "::error::falta .env.example (asset obrigatorio no pubspec)."
            exit 1
          fi

          if [ -f /tmp/cm_yw_tdlib_ios_enabled ]; then
            YAHWEH_TDLIB_IOS_ENABLED="$(cat /tmp/cm_yw_tdlib_ios_enabled)"
          fi
          export GHA_IOS_EXTRA_ARGS="--dart-define=YAHWEH_TDLIB_IOS_ENABLED=${YAHWEH_TDLIB_IOS_ENABLED:-0}"

          bash "$ROOT/scripts/gha_ios_build_ipa.sh" "$FLUTTER_PWD"

          # Cauda: os passos seguintes (dSYM, copia para ASC, site) leem estes caminhos.
          IPA_PATH="$(find "$FLUTTER_PWD/build/ios/ipa" -maxdepth 1 -name '*.ipa' -type f 2>/dev/null | head -n 1)"
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "::error::nenhum .ipa em $FLUTTER_PWD/build/ios/ipa apos o export."
            ls -la "$FLUTTER_PWD/build/ios/ipa" 2>/dev/null || true
            exit 1
          fi
          ABS_IPA="$(cd "$(dirname "$IPA_PATH")" && pwd)/$(basename "$IPA_PATH")"
          echo "$ABS_IPA" > "$FLUTTER_PWD/.cm_last_ipa_path"
          echo "$ABS_IPA" > "$ROOT/.cm_yw_last_ipa_path"
          mkdir -p "$ROOT/build/ios/ipa"
          bash "$ROOT/scripts/codemagic_ios_cp_ipa_safe.sh" "$ABS_IPA" "$ROOT/build/ios/ipa"
          bash "$ROOT/scripts/codemagic_ios_normalize_ipa_for_asc.sh"
          echo "IPA: $ABS_IPA"
          ls -la "$ROOT/build/ios/ipa" "$FLUTTER_PWD/build/ios/ipa"

      - name: Upload dSYM para Firebase Crashlytics (obrigatorio)
        continue-on-error: true
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          export CM_CRASHLYTICS_DSYM_REQUIRED=1
          bash "$ROOT/scripts/codemagic_ios_upload_crashlytics_dsyms.sh"
          echo "dSYM enviados — UUID desta build no Console Crashlytics deve ficar resolvido."

      - name: IPA para publicação ASC (cópia na raiz do repo)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          cd "$ROOT"
          LAYOUT="$(cat /tmp/cm_yw_layout)"
          FPROOT="$ROOT"
          [ "$LAYOUT" = mono ] && FPROOT="$ROOT/flutter_app"
          mkdir -p build/ios/ipa
          BD="${FLUTTER_BUILD_DIR:-build}"
          if [ "${BD#/}" != "$BD" ]; then
            CLASSIC_IPA_DIR="$BD/ios/ipa"
          else
            CLASSIC_IPA_DIR="$FPROOT/$BD/ios/ipa"
          fi
          # O passo anterior ja copia para build/ios/ipa — so validar e completar fallbacks.
          if find build/ios/ipa -maxdepth 1 -name "*.ipa" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "OK: .ipa ja presente em build/ios/ipa (passo Flutter build IPA)."
            ls -la build/ios/ipa/
            exit 0
          fi
          rm -f build/ios/ipa/*.ipa 2>/dev/null || true
          COPIED=0
          for marker in "$ROOT/.cm_yw_last_ipa_path" "$FPROOT/.cm_last_ipa_path"; do
            if [ ! -f "$marker" ]; then
              continue
            fi
            IPA_FILE="$(tr -d '\r\n' < "$marker" | head -n 1)"
            if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
              bash "$ROOT/scripts/codemagic_ios_cp_ipa_safe.sh" "$IPA_FILE" "$ROOT/build/ios/ipa"
              COPIED=1
              echo "Copiado via $marker: $IPA_FILE"
              break
            fi
            echo "AVISO: $marker invalido ou ficheiro ausente: ${IPA_FILE:-<vazio>}"
          done
          if [ "$COPIED" -eq 0 ] && [ -d "$CLASSIC_IPA_DIR" ]; then
            find "$CLASSIC_IPA_DIR" -maxdepth 1 -name "*.ipa" -type f | while read -r _ipa; do
              bash "$ROOT/scripts/codemagic_ios_cp_ipa_safe.sh" "$_ipa" "$ROOT/build/ios/ipa"
            done
            if find build/ios/ipa -maxdepth 1 -name "*.ipa" -type f -print -quit 2>/dev/null | grep -q .; then
              COPIED=1
            fi
          fi
          for extra in "$FPROOT/build/ios/ipa" "$ROOT/flutter_app/build/ios/ipa" "$ROOT/build/ios/ipa"; do
            if [ "$COPIED" -ne 0 ]; then
              break
            fi
            if [ ! -d "$extra" ]; then
              continue
            fi
            find "$extra" -maxdepth 1 -name "*.ipa" -type f | while read -r _ipa; do
              bash "$ROOT/scripts/codemagic_ios_cp_ipa_safe.sh" "$_ipa" "$ROOT/build/ios/ipa"
            done
            if find build/ios/ipa -maxdepth 1 -name "*.ipa" -type f -print -quit 2>/dev/null | grep -q .; then
              COPIED=1
              echo "Copiado de $extra"
            fi
          done
          if [ "$COPIED" -eq 0 ]; then
            echo "Fallback: a procurar .ipa no clone (excl. .git) ..."
            find "$ROOT" -name "*.ipa" -type f -not -path "*/.git/*" 2>/dev/null | head -20 > /tmp/cm_ipa_list.txt
            if [ ! -s /tmp/cm_ipa_list.txt ]; then
              echo "ERRO: nenhum .ipa em flutter_app/build/ios/ipa nem na raiz (export falhou ou caminho mudou)."
              echo "  Use codemagic.yaml deste repositorio (Team app > Configuration file from repository)."
              echo "  CM_BUILD_DIR=$ROOT LAYOUT=$LAYOUT CLASSIC_IPA_DIR=$CLASSIC_IPA_DIR"
              find "$ROOT" -name "*.ipa" -not -path "*/.git/*" 2>/dev/null | head -30 || true
              ls -la "$FPROOT/build/ios" 2>/dev/null || true
              ls -la "$ROOT/build/ios" 2>/dev/null || true
              exit 1
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              bash "$ROOT/scripts/codemagic_ios_cp_ipa_safe.sh" "$f" "$ROOT/build/ios/ipa"
            done < /tmp/cm_ipa_list.txt
          fi
          echo "IPAs prontos para artefactos / App Store Connect:"
          ls -la build/ios/ipa/
          ls -la "$CLASSIC_IPA_DIR" 2>/dev/null || true
          # Alguns passos / publicadores procuram *.ipa na raiz do clone — copiar também para ROOT.
          if find build/ios/ipa -maxdepth 1 -name "*.ipa" -type f -print -quit 2>/dev/null | grep -q .; then
            find build/ios/ipa -maxdepth 1 -name "*.ipa" -type f | while read -r _ipa; do
              bash "$ROOT/scripts/codemagic_ios_cp_ipa_safe.sh" "$_ipa" "$ROOT"
            done
            echo "Copia para raiz do workspace ($ROOT):"
            ls -la "$ROOT"/*.ipa 2>/dev/null || true
          fi

      - name: Subir IPA para o site (Firebase Storage) e atualizar link na divulgação
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.subir_site }}
        continue-on-error: true
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          cd "$ROOT"
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON vazio — a saltar upload IPA (Storage + app_public/ios_build)."
            exit 0
          fi
          IPA=""
          for cand in build/ios/ipa/*.ipa flutter_app/build/ios/ipa/*.ipa; do
            if [ -f "$cand" ]; then IPA="$cand"; break; fi
          done
          if [ -z "$IPA" ]; then
            IPA=$(find "$ROOT" -name "*.ipa" -type f -not -path "*/.git/*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "ERRO: nenhum .ipa para upload Firebase."
            exit 1
          fi
          cd "$ROOT/functions"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev 2>/dev/null || npm install --omit=dev
          else
            npm install --omit=dev
          fi
          cd "$ROOT"
          export CM_BUILD_DIR="$ROOT"
          node "$ROOT/scripts/codemagic_publish_ipa_to_firebase.js" "$IPA"

      - name: Firebase App Distribution (FIREBASE_SERVICE_ACCOUNT_JSON)
        continue-on-error: true
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON vazio - a saltar App Distribution."
            exit 0
          fi
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          cd "$ROOT"
          IPA=""
          BD="${FLUTTER_BUILD_DIR:-build}"
          for cand in build/ios/ipa/*.ipa "flutter_app/$BD/ios/ipa/"*.ipa flutter_app/build/ios/ipa/*.ipa "$BD/ios/ipa/"*.ipa; do
            if [ -f "$cand" ]; then IPA="$cand"; break; fi
          done
          if [ -z "$IPA" ]; then
            IPA=$(find "$ROOT" -name "*.ipa" -type f -not -path "*/.git/*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "ERRO: nenhum .ipa para App Distribution."
            find "$ROOT" -name "*.ipa" -not -path "*/.git/*" 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "App Distribution IPA: $IPA"
          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/gcp-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
          npm install -g firebase-tools@13
          NOTES="Gestao YAHWEH CI build ${CM_BUILD_NUMBER:-?}"
          if [ -n "${APP_VERSION_SECRET:-}" ]; then
            NOTES="$APP_VERSION_SECRET"
          fi
          firebase appdistribution:distribute "$IPA" \
            --app "$FIREBASE_IOS_APP_ID" \
            --groups "$FIREBASE_APP_DISTRIBUTION_GROUPS" \
            --release-notes "$NOTES"

      - name: Renomear IPA para App Store Connect (nome ASCII)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_normalize_ipa_for_asc.sh"

      - name: Validar IPA (evitar Binário inválido no TestFlight)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_validate_ipa_before_upload.sh"

      - name: Gate final anti-90189 (obrigatório — NÃO Retry só Publishing)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_pre_publish_90189_gate.sh"

      - name: Gravar asc_build_number_floor (anti-90189 próximo build)
        run: |
          set -e
          ROOT="${CM_BUILD_DIR:-${FCI_BUILD_DIR:-$(pwd)}}"
          bash "$ROOT/scripts/codemagic_ios_stamp_asc_floor.sh"

      - name: Guardar IPA como artefato do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GestaoYahweh-ipa
          path: |
            flutter_app/build/ios/ipa/*.ipa
            *.ipa
          if-no-files-found: warn
          retention-days: 30

      # No Codemagic o envio ao TestFlight era a secao publishing.app_store_connect;
      # aqui e o mesmo CLI, chamado explicitamente.
      - name: Enviar para o TestFlight (App Store Connect)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enviar_testflight }}
        run: |
          set -e
          IPA=$(ls -1 flutter_app/build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then IPA=$(ls -1 build/ios/ipa/*.ipa 2>/dev/null | head -1); fi
          if [ -z "$IPA" ]; then echo "::error::nenhum .ipa encontrado para enviar"; exit 1; fi
          # Mesmo script de envio dos outros apps: 3 tentativas e 90189 tratado.
          GHA_IOS_IPA_PATH="$IPA" bash scripts/gha_ios_publish_testflight.sh .

      - name: Guardar piso de build number e PEM de bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GestaoYahweh-signing-output
          path: |
            flutter_app/ios/asc_build_number_floor.txt
            bootstrap_signing_output/**
          if-no-files-found: ignore
